name: inference_compute_guided
description: "Inference-time compute scaling for LLM reasoning — guided mode (run in parallel with inference_compute_baseline)"

llm:
  provider: minimax
  model: MiniMax-M2.7

search:
  backend: tavily
  max_results: 8
  research_mode: false

agent:
  recovery_max_attempts: 3
  query_rewrite_variants: 2
  rerank_top_k: 5
  query_compressor_model: MiniMax-M2.7
  search_parallelism: 4
  adaptive_parallelism: true
  extract_parallelism: 6
  enable_claim_filter: true
  diminishing_window: 5
  min_coverage_for_diminishing: 0.4

domain_policy:
  research_domains:
    - arxiv.org
    - semanticscholar.org
    - aclanthology.org
    - openreview.net
    - proceedings.mlr.press
    - jmlr.org
    - neurips.cc
    - research.google
    - anthropic.com
    - openai.com
    - deepmind.google
    - deepmind.com
    - ai.meta.com
    - huggingface.co
    - mistral.ai
  low_trust_domains:
    - researchgate.net
    - emergentmind.com
    - aipromptsdirectory.com
    - analytics.usa.gov
    - linkedin.com
  high_score: 0.9
  medium_high_score: 0.75
  medium_score: 0.5
  low_score: 0.2

output_dir: runs

runs:
  - query: "What is the current state of inference-time compute scaling for LLM reasoning? Separate what has been empirically validated from what is still speculative, and identify where the evidence is too thin to draw conclusions."
    modes: [guided]
    max_steps: 10
    shared_sources: false
