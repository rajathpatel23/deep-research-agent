name: multi_agent_landscape_guided
description: "Research landscape of multi-agent LLM systems — guided mode (run in parallel with multi_agent_landscape_baseline)"

llm:
  provider: minimax
  model: MiniMax-M2.7

search:
  backend: minimax
  max_results: 8
  research_mode: false

agent:
  recovery_max_attempts: 3
  query_rewrite_variants: 2
  rerank_top_k: 5
  query_compressor_model: MiniMax-M2.7
  search_parallelism: 4
  adaptive_parallelism: true
  extract_parallelism: 6
  enable_claim_filter: true
  diminishing_window: 5
  min_coverage_for_diminishing: 0.4

domain_policy:
  research_domains:
    - arxiv.org
    - semanticscholar.org
    - aclanthology.org
    - openreview.net
    - proceedings.mlr.press
    - jmlr.org
    - neurips.cc
    - research.google
    - anthropic.com
    - openai.com
    - deepmind.google
    - deepmind.com
    - ai.meta.com
    - huggingface.co
    - mistral.ai
  low_trust_domains:
    - researchgate.net
    - emergentmind.com
    - aipromptsdirectory.com
    - analytics.usa.gov
    - linkedin.com
  high_score: 0.9
  medium_high_score: 0.75
  medium_score: 0.5
  low_score: 0.2

output_dir: runs

runs:
  - query: "Map the research landscape of multi-agent LLM systems. Produce a structured report that includes a visual taxonomy or design graph showing the major architectural patterns, how they relate, and where the open problems are."
    modes: [guided]
    max_steps: 12
    shared_sources: false
